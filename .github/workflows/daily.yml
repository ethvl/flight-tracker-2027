name: Daily flight price update

on:
  schedule:
    - cron: "0 0 * * *"      # 00:00 UTC = 08:00 Singapore
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-prices
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Fetch prices, send Telegram report, build dashboard
        env:
          TZ: Asia/Singapore        # timestamps on the page and in Telegram are Singapore time
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
        run: python -m tracker run --send

      - name: Save price history back to the repo
        if: always()
        run: |
          git config user.name "flight-tracker"
          git config user.email "actions@users.noreply.github.com"
          git add data/prices.db
          git diff --cached --quiet || git commit -m "Price snapshot $(date -u +%F)"
          git push

      # Dashboard fallback / companion view (enable Pages: Settings > Pages > Source: GitHub Actions)
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deploy
        uses: actions/deploy-pages@v4
